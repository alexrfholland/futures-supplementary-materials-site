lang: en-GB

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - appendices/appendix_A_glossary.qmd
    - appendices/appendix_B_vignette_evidence.qmd
    - appendices/appendix_C_places.qmd
    - appendices/appendix_D_personas_and_capabilities.qmd
    - appendices/appendix_E_capability_groups_and_indicators.qmd
    - appendices/appendix_F_habitat_features.qmd
    - appendices/appendix_G_habitat_volumes.qmd
    - appendices/appendix_H_resistance.qmd
    - appendices/appendix_I_proposals_and_interventions.qmd
    - appendices/appendix_J_pathway_simulation.qmd
    - appendices/appendix_K_baseline_woodlands.qmd
    - appendices/appendix_J1_tree_growth.qmd
    - appendices/appendix_J2_tree_lifecycle.qmd
    - appendices/appendix_J3_recruitment_and_mortality.qmd
  resources:
    - media/**

website:
  title: "Nonhuman leadership: supplementary materials"
  site-url: "https://alexrfholland.github.io/futures-supplementary-materials-site/"
  page-navigation: true
  reader-mode: true
  search: true
  navbar:
    title: "Nonhuman leadership"
    left:
      - text: "Supplementary materials"
        href: index.qmd
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Overview"
        href: index.qmd
      - text: "Appendix A: Glossary"
        href: appendices/appendix_A_glossary.qmd
      - text: "Appendix B: Supporting evidence for the vignettes"
        href: appendices/appendix_B_vignette_evidence.qmd
      - text: "Appendix C: Places"
        href: appendices/appendix_C_places.qmd
      - text: "Appendix D: Personas and capabilities"
        href: appendices/appendix_D_personas_and_capabilities.qmd
      - text: "Appendix E: Capability groups and indicators"
        href: appendices/appendix_E_capability_groups_and_indicators.qmd
      - text: "Appendix F: Habitat features"
        href: appendices/appendix_F_habitat_features.qmd
      - text: "Appendix G: Habitat volumes"
        href: appendices/appendix_G_habitat_volumes.qmd
      - text: "Appendix H: Resistance"
        href: appendices/appendix_H_resistance.qmd
      - text: "Appendix I: Proposals and interventions"
        href: appendices/appendix_I_proposals_and_interventions.qmd
      - text: "Appendix J: Pathway simulation"
        href: appendices/appendix_J_pathway_simulation.qmd
      - section: "Pathway simulation submodules"
        contents:
          - text: "J.1: Tree growth submodule"
            href: appendices/appendix_J1_tree_growth.qmd
          - text: "J.2: Tree lifecycle submodule"
            href: appendices/appendix_J2_tree_lifecycle.qmd
          - text: "J.3: Recruitment and mortality submodule"
            href: appendices/appendix_J3_recruitment_and_mortality.qmd
      - text: "Appendix K: Baseline woodlands"
        href: appendices/appendix_K_baseline_woodlands.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    filters:
      - tables.lua

lang: en-GB

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - appendix_A_glossary.qmd
    - appendix_B_places.qmd
    - appendix_C_personas_capabilities_and_relational_indicators.qmd
    - appendix_D_habitat_features.qmd
    - appendix_E_habitat_volumes.qmd
    - appendix_F_resistance.qmd
    - appendix_G_pathway_simulation.qmd
    - appendix_G_pathway_simulation_growth-submodule.qmd
    - appendix_G_pathway_simulation_lifecycle-submodule.qmd
    - appendix_G_pathway_simulation_recruit-mortality-submodule.qmd
    - appendix_H_baseline_woodlands.qmd
    - persona_bird.qmd
    - persona_tree.qmd
    - persona_tree_fungal-research.qmd
    - persona_lizard.qmd
    - updated_appendices/updated_01_vignette_evidence.qmd
    - updated_appendices/updated_02_place.qmd
    - updated_appendices/updated_03_personas.qmd
    - updated_appendices/updated_04_indicators.qmd
    - updated_appendices/updated_05_proposals.qmd
    - updated_appendices/updated_06_pathways.qmd
    - updated_appendices/updated_07_expansion_reachability.qmd
  resources:
    - media/**

website:
  title: "Nonhuman leadership: supplementary materials"
  site-url: "https://alexrfholland.github.io/futures-supplementary-materials-site/"
  page-navigation: true
  reader-mode: true
  search: true
  navbar:
    title: "Nonhuman leadership"
    left:
      - text: "Supplementary materials"
        href: index.qmd
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Overview"
        href: index.qmd
      - section: "Updated appendices"
        contents:
          - text: "Supporting evidence for the vignettes"
            href: updated_appendices/updated_01_vignette_evidence.qmd
          - text: "Place"
            href: updated_appendices/updated_02_place.qmd
          - text: "Personas"
            href: updated_appendices/updated_03_personas.qmd
          - text: "Capabilities and indicators"
            href: updated_appendices/updated_04_indicators.qmd
          - text: "Proposals"
            href: updated_appendices/updated_05_proposals.qmd
          - text: "Pathways"
            href: updated_appendices/updated_06_pathways.qmd
          - text: "Details on expansion and reachability"
            href: updated_appendices/updated_07_expansion_reachability.qmd
      - section: "Appendices"
        contents:
          - appendix_A_glossary.qmd
          - appendix_B_places.qmd
          - appendix_C_personas_capabilities_and_relational_indicators.qmd
          - section: "Provisional persona backgrounds"
            contents:
              - text: "Bird (provisional)"
                href: persona_bird.qmd
              - text: "Tree (provisional)"
                href: persona_tree.qmd
              - text: "Tree fungal research (provisional)"
                href: persona_tree_fungal-research.qmd
              - text: "Lizard (provisional)"
                href: persona_lizard.qmd
          - appendix_D_habitat_features.qmd
          - appendix_E_habitat_volumes.qmd
          - appendix_F_resistance.qmd
          - text: "Appendix G: Pathway simulation"
            href: appendix_G_pathway_simulation.qmd
          - section: "Pathway simulation submodules"
            contents:
              - appendix_G_pathway_simulation_growth-submodule.qmd
              - appendix_G_pathway_simulation_lifecycle-submodule.qmd
              - appendix_G_pathway_simulation_recruit-mortality-submodule.qmd
          - appendix_H_baseline_woodlands.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    filters:
      - tables.lua

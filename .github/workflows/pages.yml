name: Build and deploy supplementary site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supplementary-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render site
        run: quarto render .

      - name: Check published files
        run: |
          test -s _site/index.html

          expected_html=$(cat <<'HTML'
          appendices/appendix_A_glossary.html
          appendices/appendix_B_vignette_evidence.html
          appendices/appendix_C_places.html
          appendices/appendix_D_personas_and_capabilities.html
          appendices/appendix_E_capability_groups_and_indicators.html
          appendices/appendix_F_habitat_features.html
          appendices/appendix_G_habitat_volumes.html
          appendices/appendix_H_resistance.html
          appendices/appendix_I_proposals_and_interventions.html
          appendices/appendix_J1_tree_growth.html
          appendices/appendix_J2_tree_lifecycle.html
          appendices/appendix_J3_recruitment_and_mortality.html
          appendices/appendix_J_pathway_simulation.html
          appendices/appendix_K_baseline_woodlands.html
          index.html
          HTML
          )
          actual_html=$(find _site -type f -name '*.html' -printf '%P\n' | sort)
          if [ "$actual_html" != "$expected_html" ]; then
            echo 'Rendered HTML files do not match the 15-page site allowlist.' >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_html" "$actual_html" >&2
            exit 1
          fi

          if grep -RInE 'file:///|/(Users|home)/[[:alnum:]_.-]+/' _site --include='*.html'; then
            echo 'Rendered HTML contains a local workstation path.' >&2
            exit 1
          fi

      - name: Check rendered tables
        run: python3 check-tables.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
